<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b0764">
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg-color, #f1f5f9); 
            color: var(--text-color, #334155);
            font-family: var(--font-family, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif);
            margin: 0; 
            padding: 15px; 
            transition: background 0.3s, font-family 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container { max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
        
        /* Top Control Bar */
        .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        
        .control-btn { 
            background: linear-gradient(135deg, #3b0764, #581c87); 
            color: #fbbf24; 
            border: 2px solid #d97706; 
            padding: 8px 16px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px; 
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.2); 
            transition: 0.3s; 
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .control-btn:hover { 
            background: linear-gradient(135deg, #581c87, #6b21a8); 
            box-shadow: 0 6px 15px rgba(217, 119, 6, 0.4); 
        }

        /* Header with Gold Border Accent */
        .header { 
            text-align: center; 
            color: #3b0764; 
            margin-bottom: 20px; 
            padding: 18px; 
            background: #ffffff; 
            border-radius: 14px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.08); 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border: 2px solid #fbbf24;
            border-bottom: 5px solid #d97706;
        }
        .header-logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
            padding: 2px;
            border: 1px solid #d97706;
        }
        .header h2 { margin: 0; font-size: 22px; font-weight: 700; }

        /* Search Section */
        .search-area { display: flex; align-items: center; gap: 8px; background: #ffffff; padding: 14px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.06); margin-bottom: 15px; flex-wrap: wrap; border: 1.5px solid #fde68a; }
        .search-label { font-weight: bold; color: inherit; font-size: 14px; }
        select { padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; background: #f8fafc; font-size: 14px; font-weight: 600; color: #1e293b; outline: none; }
        .input-group { display: flex; flex: 1; min-width: 180px; border: 1.5px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #fff; }
        .input-group input { border: none; padding: 10px 14px; width: 100%; font-size: 15px; outline: none; color: #000; }
        .input-group button { background: #3b0764; color: #fbbf24; border: none; padding: 0 16px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .input-group button:hover { background: #581c87; }

        #status { text-align: center; font-size: 14px; color: inherit; margin-bottom: 15px; font-weight: 600; opacity: 0.8; }

        /* Driver Card Design */
        .driver-card { 
            background-color: var(--card-bg, #a6e6a4); 
            border: 1.5px solid var(--card-border, #d97706); 
            border-radius: 14px; 
            padding: 18px; 
            margin-bottom: 16px; 
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.12); 
            transition: transform 0.2s, background-color 0.3s, border-color 0.3s; 
            color: #1e293b; 
        }
        .driver-card:hover { transform: translateY(-2px); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
        
        .info-list { flex: 1; }
        .info-list p { margin: 8px 0; font-size: 15px; color: #334155; line-height: 1.5; }
        .info-list span.label { font-weight: bold; color: #7c3aed; display: inline-block; min-width: 80px; }
        .info-list strong { color: #0f172a; font-size: 16px; }

        /* Right Side Box */
        .right-box { width: 110px; min-height: 110px; border: 2px dashed #d97706; border-radius: 10px; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; text-align: center; }
        .right-box .avatar { font-size: 30px; margin-bottom: 2px; }
        .right-box .badge { font-size: 11px; font-weight: bold; color: #0f172a; background: #fef3c7; border: 1px solid #f59e0b; padding: 2px 6px; border-radius: 4px; margin-top: 3px; width: 100%; word-break: break-all; }

        /* Bottom Action Buttons */
        .card-actions { display: flex; justify-content: space-between; gap: 10px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.1); }
        .btn { flex: 1; text-align: center; padding: 10px 8px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-call { background-color: #0284c7; }
        .btn-wa { background-color: #16a34a; }
        .btn-msg { background-color: #ea580c; }

        /* Settings Modal Popup Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-content {
            background: #1e293b;
            color: #f8fafc;
            width: 100%;
            max-width: 420px;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #d97706;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .modal-header h3 { margin: 0; color: #fbbf24; font-size: 18px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        
        .section-title { font-size: 13px; font-weight: bold; color: #94a3b8; margin: 15px 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .preset-btn {
            background: #0f172a;
            color: #f8fafc;
            border: 1.5px solid #475569;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preset-btn:hover { border-color: #fbbf24; background: #334155; }

        .color-picker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 14px;
        }
        .color-picker-row input[type="color"] {
            border: none;
            width: 35px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }

        .modal-select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            color: #f8fafc;
            border: 1.5px solid #475569;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
        }

        .save-changes-btn {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(147, 51, 234,.4);
            transition: 0.2s;
        }
        .save-changes-btn:hover { background: linear-gradient(135deg, #9333ea, #a855f7); }

        /* Footer Layout */
        .directory-footer {
            margin-top: 30px;
            padding: 15px 10px;
            font-size: 13px;
            color: inherit;
            opacity: 0.95;
            font-weight: 600;
            border-top: 2px solid #d97706;
        }
        .footer-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            text-align: center;
        }
        .footer-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .social-icon {
            color: #d97706;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.2s;
        }
        .social-icon:hover {
            opacity: 0.7;
            transform: scale(1.1);
        }
        .footer-signature {
            font-style: italic;
            font-size: 12px;
            font-weight: bold;
            color: #7c3aed;
            margin: 0 5px;
        }
    </style>
</head>
