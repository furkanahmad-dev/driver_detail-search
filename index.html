<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Al-Khaldi - Employee Search</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background-color: var(--bg-color, #f1f5f9); 
            color: var(--text-color, #334155);
            font-family: var(--font-family, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif);
            margin: 0; 
            padding: 15px; 
            transition: background 0.3s, font-family 0.3s;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container { max-width: 600px; margin: 0 auto; width: 100%; flex: 1; }
        
        /* Top Control Bar */
        .top-bar { display: flex; justify-content: flex-end; align-items: center; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        
        .control-btn { 
            background: linear-gradient(135deg, #3b0764, #581c87); 
            color: #fbbf24; 
            border: 2px solid #d97706; 
            padding: 8px 16px; 
            border-radius: 20px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 13px; 
            box-shadow: 0 4px 10px rgba(217, 119, 6, 0.2); 
            transition: 0.3s; 
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .control-btn:hover { 
            background: linear-gradient(135deg, #581c87, #6b21a8); 
            box-shadow: 0 6px 15px rgba(217, 119, 6, 0.4); 
        }

        /* Header with Gold Border Accent */
        .header { 
            text-align: center; 
            color: #3b0764; 
            margin-bottom: 20px; 
            padding: 18px; 
            background: #ffffff; 
            border-radius: 14px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.08); 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            border: 2px solid #fbbf24;
            border-bottom: 5px solid #d97706;
        }
        .header-logo {
            width: 55px;
            height: 55px;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
            padding: 2px;
            border: 1px solid #d97706;
        }
        .header h2 { margin: 0; font-size: 22px; font-weight: 700; }

        /* Search Section */
        .search-area { display: flex; align-items: center; gap: 8px; background: #ffffff; padding: 14px; border-radius: 12px; box-shadow: 0 6px 16px rgba(0,0,0,0.06); margin-bottom: 15px; flex-wrap: wrap; border: 1.5px solid #fde68a; }
        .search-label { font-weight: bold; color: inherit; font-size: 14px; }
        select { padding: 10px 12px; border: 1.5px solid #cbd5e1; border-radius: 8px; background: #f8fafc; font-size: 14px; font-weight: 600; color: #1e293b; outline: none; }
        .input-group { display: flex; flex: 1; min-width: 180px; border: 1.5px solid #cbd5e1; border-radius: 8px; overflow: hidden; background: #fff; }
        .input-group input { border: none; padding: 10px 14px; width: 100%; font-size: 15px; outline: none; color: #000; }
        .input-group button { background: #3b0764; color: #fbbf24; border: none; padding: 0 16px; cursor: pointer; font-size: 16px; transition: 0.2s; }
        .input-group button:hover { background: #581c87; }

        #status { text-align: center; font-size: 14px; color: inherit; margin-bottom: 15px; font-weight: 600; opacity: 0.8; }

        /* Driver Card Design */
        .driver-card { 
            background-color: var(--card-bg, #a6e6a4); 
            border: 1.5px solid var(--card-border, #d97706); 
            border-radius: 14px; 
            padding: 18px; 
            margin-bottom: 16px; 
            box-shadow: 0 8px 20px rgba(217, 119, 6, 0.12); 
            transition: transform 0.2s, background-color 0.3s, border-color 0.3s; 
            color: #1e293b; 
        }
        .driver-card:hover { transform: translateY(-2px); }
        .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
        
        .info-list { flex: 1; }
        .info-list p { margin: 8px 0; font-size: 15px; color: #334155; line-height: 1.5; }
        .info-list span.label { font-weight: bold; color: #7c3aed; display: inline-block; min-width: 80px; }
        .info-list strong { color: #0f172a; font-size: 16px; }

        /* Right Side Box */
        .right-box { width: 110px; min-height: 110px; border: 2px dashed #d97706; border-radius: 10px; background: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6px; text-align: center; }
        .right-box .avatar { font-size: 30px; margin-bottom: 2px; }
        .right-box .badge { font-size: 11px; font-weight: bold; color: #0f172a; background: #fef3c7; border: 1px solid #f59e0b; padding: 2px 6px; border-radius: 4px; margin-top: 3px; width: 100%; word-break: break-all; }

        /* Bottom Action Buttons */
        .card-actions { display: flex; justify-content: space-between; gap: 10px; padding-top: 14px; border-top: 1px solid rgba(0,0,0,0.1); }
        .btn { flex: 1; text-align: center; padding: 10px 8px; border-radius: 30px; text-decoration: none; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.1); transition: 0.2s; }
        .btn:hover { opacity: 0.9; }
        .btn-call { background-color: #0284c7; }
        .btn-wa { background-color: #16a34a; }
        .btn-msg { background-color: #ea580c; }

        /* Settings Modal Popup Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }
        .modal-content {
            background: #1e293b;
            color: #f8fafc;
            width: 100%;
            max-width: 420px;
            padding: 22px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #d97706;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .modal-header h3 { margin: 0; color: #fbbf24; font-size: 18px; }
        .close-btn { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        
        .section-title { font-size: 13px; font-weight: bold; color: #94a3b8; margin: 15px 0 8px 0; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .preset-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 15px;
        }
        .preset-btn {
            background: #0f172a;
            color: #f8fafc;
            border: 1.5px solid #475569;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .preset-btn:hover { border-color: #fbbf24; background: #334155; }

        .color-picker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #334155;
            font-size: 14px;
        }
        .color-picker-row input[type="color"] {
            border: none;
            width: 35px;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }

        .modal-select {
            width: 100%;
            padding: 10px;
            background: #0f172a;
            color: #f8fafc;
            border: 1.5px solid #475569;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            margin-bottom: 20px;
        }

        .save-changes-btn {
            width: 100%;
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(147, 51, 234,.4);
            transition: 0.2s;
        }
        .save-changes-btn:hover { background: linear-gradient(135deg, #9333ea, #a855f7); }

        /* Footer Layout */
        .directory-footer {
            margin-top: 30px;
            padding: 15px 10px;
            font-size: 13px;
            color: inherit;
            opacity: 0.95;
            font-weight: 600;
            border-top: 2px solid #d97706;
        }
        .footer-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            text-align: center;
        }
        .footer-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .social-icon {
            color: #d97706;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s, transform 0.2s;
        }
        .social-icon:hover {
            opacity: 0.7;
            transform: scale(1.1);
        }
        .footer-signature {
            font-style: italic;
            font-size: 12px;
            font-weight: bold;
            color: #7c3aed;
            margin: 0 5px;
        }
    </style>
</head>

    <div class="header">

    </div>

    <div class="search-area">
        <span class="search-label" id="searchByLabel">Search By</span>
        <select id="searchBy">
            <option value="all" id="optAll">All</option>
            <option value="id" id="optId">By ID</option>
            <option value="door" id="optDoor">Door</option>
            <option value="plate" id="optPlate">Plate</option>
            <option value="mobile" id="optMobile">Mobile</option>
            <option value="name" id="optName">Name</option>
        </select>
        <div class="input-group">
            <input type="text" id="searchInput" placeholder="Enter details to search...">
            <button type="button" onclick="filterDrivers()">🔍</button>
        </div>
    </div>

    <div id="status">Loading data securely...</div>
    <div id="resultsContainer"></div>
</div>

<script>
    // 👇 YAHAN APNA APPS SCRIPT KA WEB APP URL PASTE KAREIN 👇
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyMvr4NZNh5JAOTBR_k_IioingXwsM5pDigJ1v_C3_Pak2O0kFeJeuC4wahfsTgXXSI2w/exec";
    let drivers = [];
    let isDataLoaded = false;
    let currentLang = "en";

    async function initSheetScript() {
        const statusEl = document.getElementById("status");
        
        try {
            const response = await fetch(APPS_SCRIPT_URL);
            const textResponse = await response.text();
            
            let result;
            try {
                result = JSON.parse(textResponse);
            } catch (e) {
                // Agar HTML login page return hua hai (matlab unauthorized/session out)
                statusEl.innerText = "Authentication required. Please open this link in an authorized Google account session.";
                return;
            }

            if (result.status === "error") {
                statusEl.innerText = result.message;
                return;
            }

            const rows = result.data.slice(1); // Headers chhod kar data uthana
            
            drivers = rows.map(row => ({
                door: String(row[0] || "").trim(),
                plate: String(row[1] || "").trim(),
                id: String(row[2] || "").trim(),
                name: String(row[3] || "").trim(),
                project: String(row[4] || "").trim(),
                mobile: String(row[5] || "").trim()
            })).filter(d => d.door !== "DOOR NO." && (d.name !== "" || d.id !== ""));

            isDataLoaded = true;
            statusEl.innerText = translations[currentLang].readyPrompt;
            document.getElementById("resultsContainer").innerHTML = "";

        } catch (err) {
            console.error("Fetch error:", err);
            statusEl.innerText = "Failed to load data. Please ensure you are logged in with an authorized Google Account";
        }
    }

    function openSettingsModal() {
        document.getElementById("settingsModal").style.display = "flex";
    }

    function closeSettingsModal() {
        document.getElementById("settingsModal").style.display = "none";
    }

    function applyPreset(bgColor, textColor, cardBgColor, cardBorderColor) {
        document.documentElement.style.setProperty('--bg-color', bgColor);
        document.documentElement.style.setProperty('--text-color', textColor);
        document.documentElement.style.setProperty('--card-bg', cardBgColor);
        document.documentElement.style.setProperty('--card-border', cardBorderColor);

        document.getElementById("mainBgPicker").value = bgColor;
        document.getElementById("cardBgPicker").value = cardBgColor;
        document.getElementById("cardBorderPicker").value = cardBorderColor;
    }

    function updateMainBg(val) { document.documentElement.style.setProperty('--bg-color', val); }
    function updateCardBg(val) { document.documentElement.style.setProperty('--card-bg', val); }
    function updateCardBorder(val) { document.documentElement.style.setProperty('--card-border', val); }
    function updateFont(fontVal) { document.documentElement.style.setProperty('--font-family', fontVal); }

    const translations = {
        en: {
            dir: "ltr", langBtn: "🌐 العربية", title: "Al-Khaldi Employee Directory", searchBy: "Search By",
            optAll: "All", optId: "By ID", optDoor: "Door", optPlate: "Plate", optMobile: "Mobile", optName: "Name",
            placeholder: "Enter details to search...", loading: "Loading data, please wait...", readyPrompt: "Please enter ID, Door, Plate, or Mobile above to search.",
            error: "Could not load data. Please check internet connection.", found: "Records Found: ", noResult: "No matching record found",
            lblName: "Name -", lblId: "ID -", lblMob: "MOB -", lblProject: "Project -", noDoor: "No Door", noPlate: "No Plate",
            btnCall: "Call 📞", btnWa: "WhatsApp 💬", btnMsg: "MSG ✉️", footer: "Design by Furkan Ahmad",
            modalTitle: "Theme & Appearance", presetTitle: "Quick Theme Presets", customTitle: "Custom Color Pickers",
            lblMainBg: "Main Background:", lblCardBg: "Card Background:", lblCardBorder: "Card Borders:", fontTitle: "Font Style", saveBtn: "Save Changes"
        },
        ar: {
            dir: "rtl", langBtn: "🌐 English", title: "دليل موظفي الخالدي", searchBy: "البحث بواسطة",
            optAll: "الكل", optId: "الرقم الوظيفي (ID)", optDoor: "رقم الباب (Door)", optPlate: "رقم اللوحة (Plate)", optMobile: "رقم الجوال (Mobile)", optName: "الاسم (Name)",
            placeholder: "أدخل البيانات للبحث...", loading: "جاري تحميل البيانات، يرجى الانتظار...", readyPrompt: "يرجى إدخال الرقم الوظيفي أو رقم الباب أو اللوحة أو الجوال للبحث.",
            error: "تعذر تحميل البيانات. يرجى التحقق من الاتصال بالإنترنت.", found: "عدد النتائج: ", noResult: "لم يتم العثور على نتائج",
            lblName: "الاسم -", lblId: "الرقم -", lblMob: "الجوال -", lblProject: "المشروع -", noDoor: "بدون باب", noPlate: "بدون لوحة",
            btnCall: "اتصال 📞", btnWa: "واتساب 💬", btnMsg: "رسالة ✉️", footer: "Design by Furkan Ahmad",
            modalTitle: "المظهر والسمات", presetTitle: "الإعدادات السريعة للمظهر", customTitle: "اختيار الألوان المخصصة",
            lblMainBg: "خلفية الصفحة الرئيسية:", lblCardBg: "خلفية البطاقة:", lblCardBorder: "حدود البطاقات:", fontTitle: "نوع الخط", saveBtn: "حفظ التغييرات"
        }
    };

    function toggleLanguage() {
        currentLang = currentLang === "en" ? "ar" : "en";
        applyLanguage();
    }

    function applyLanguage() {
        const t = translations[currentLang];
        document.documentElement.lang = currentLang;
        document.documentElement.dir = t.dir;

        document.getElementById("langBtn").innerText = t.langBtn;
        document.getElementById("titleText").innerText = t.title;
        document.getElementById("searchByLabel").innerText = t.searchBy;
        document.getElementById("optAll").innerText = t.optAll;
        document.getElementById("optId").innerText = t.optId;
        document.getElementById("optDoor").innerText = t.optDoor;
        document.getElementById("optPlate").innerText = t.optPlate;
        document.getElementById("optMobile").innerText = t.optMobile;
        document.getElementById("optName").innerText = t.optName;
        document.getElementById("searchInput").placeholder = t.placeholder;
        document.getElementById("footerText").innerText = t.footer;

        document.getElementById("modalTitle").innerText = t.modalTitle;
        document.getElementById("presetTitle").innerText = t.presetTitle;
        document.getElementById("customTitle").innerText = t.customTitle;
        document.getElementById("lblMainBg").innerText = t.lblMainBg;
        document.getElementById("lblCardBg").innerText = t.lblCardBg;
        document.getElementById("lblCardBorder").innerText = t.lblCardBorder;
        document.getElementById("fontTitle").innerText = t.fontTitle;
        document.getElementById("saveBtn").innerText = t.saveBtn;

        if (!isDataLoaded) {
            document.getElementById("status").innerText = t.loading;
        } else {
            filterDrivers();
        }
    }

    function formatPhoneForCall(mob) {
        let clean = String(mob).replace(/\D/g, '');
        if (clean.length === 9 && clean.startsWith('5')) return '0' + clean;
        return clean;
    }

    function formatPhoneForWA(mob) {
        let clean = String(mob).replace(/\D/g, '');
        if (clean.length === 9 && clean.startsWith('5')) return '966' + clean;
        else if (clean.length === 10 && clean.startsWith('05')) return '966' + clean.substring(1);
        return clean;
    }

    function renderCards(list) {
        const container = document.getElementById("resultsContainer");
        const t = translations[currentLang];

        if (list.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 25px; color:#64748b; font-weight:bold; background:#fff; border-radius:12px;">${t.noResult}</div>`;
            return;
        }

        let html = "";
        list.forEach(d => {
            const callNum = formatPhoneForCall(d.mobile);
            const waNum = formatPhoneForWA(d.mobile);

            html += `
            <div class="driver-card">
                <div class="card-top">
                    <div class="info-list">
                        <p><span class="label">${t.lblName}</span> <strong>${d.name}</strong></p>
                        <p><span class="label">${t.lblId}</span> ${d.id}</p>
                        <p><span class="label">${t.lblMob}</span> <span dir="ltr">${d.mobile}</span></p>
                        <p><span class="label">${t.lblProject}</span> ${d.project}</p>
                    </div>
                    <div class="right-box">
                        <div class="avatar">👨‍✈️</div>
                        <div class="badge" dir="ltr">${d.door || t.noDoor}</div>
                        <div class="badge" dir="ltr" style="background:#fef3c7; color:#b45309; border:1px solid #f59e0b;">${d.plate || t.noPlate}</div>
                    </div>
                </div>
                <div class="card-actions">
                    <a href="tel:${callNum}" class="btn btn-call">${t.btnCall}</a>
                    <a href="https://wa.me/${waNum}" target="_blank" class="btn btn-wa">${t.btnWa}</a>
                    <a href="sms:${callNum}" class="btn btn-msg">${t.btnMsg}</a>
                </div>
            </div>`;
        });
        container.innerHTML = html;
    }

    function filterDrivers() {
        if (!isDataLoaded) return;

        const t = translations[currentLang];
        const type = document.getElementById("searchBy").value;
        const term = document.getElementById("searchInput").value.toLowerCase().trim();

        if (!term) {
            document.getElementById("status").innerText = t.readyPrompt;
            document.getElementById("resultsContainer").innerHTML = "";
            return;
        }

        const filtered = drivers.filter(d => {
            if (type === "id") return d.id.toLowerCase().includes(term);
            if (type === "door") return d.door.toLowerCase().includes(term);
            if (type === "plate") return d.plate.toLowerCase().includes(term);
            if (type === "mobile") return d.mobile.toLowerCase().includes(term);
            if (type === "name") return d.name.toLowerCase().includes(term);
            return (
                d.id.toLowerCase().includes(term) ||
                d.door.toLowerCase().includes(term) ||
                d.plate.toLowerCase().includes(term) ||
                d.mobile.toLowerCase().includes(term) ||
                d.name.toLowerCase().includes(term) ||
                d.project.toLowerCase().includes(term)
            );
        });

        document.getElementById("status").innerText = `${t.found}${filtered.length}`;
        renderCards(filtered.slice(0, 50));
    }

    document.getElementById("searchInput").addEventListener("input", filterDrivers);
    document.getElementById("searchBy").addEventListener("change", filterDrivers);

    // Initial Load Call
    initSheetScript();
</script>

</body>
</html>
